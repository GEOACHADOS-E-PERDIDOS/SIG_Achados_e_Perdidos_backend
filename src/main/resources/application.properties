spring.application.name=geoachados

spring.datasource.url=jdbc:postgresql://localhost:5432/gisdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

api.security.token.secret=${JWT_SECRET}

# =========================
# MINIO
# =========================

minio.bucket.name=geoachados
minio.access.key=${MINIO_ACCESS_KEY}
minio.access.secret=${MINIO_ACCESS_SECRET}
minio.url=http://localhost:9000

# =========================
# MULTIPART
# =========================

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

server.tomcat.max-http-form-post-size=200MB
server.tomcat.max-part-count=50


# =========================
# EMAIL
# =========================

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true